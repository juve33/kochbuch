services:

  # Database

  db:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=kochbuch
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5002:5432"



  # Backend

  backend:
    build: ./backend
    ports:
      - "5001:5001"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DATABASE_HOST=db
      - DATABASE_USER=user
      - DATABASE_PASSWORD=password
      - DATABASE_DB=kochbuch
      - PORT=5001
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules



  # Client
  
  client:
    build: ./client
    ports:
      - "5000:5173"
    depends_on:
      - backend
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true



  # pgAdmin

  pgadmin:
    image: elestio/pgadmin:latest
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=login@pgadmin.org
      - PGADMIN_DEFAULT_PASSWORD=password
      - PGADMIN_LISTEN_PORT=5004
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5004:5004"



volumes:
  postgres_data:
  pgadmin_data: