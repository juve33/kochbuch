services:

  # Database

  db:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=kochbuch
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"



  # Backend

  backend:
    build: ./backend
    restart: always
    ports:
      - "5001:5001"
    develop:
      watch:
        - path: ./backend
          action: sync+restart
          target: /app
        - path: ./backend/package.json
          action: rebuild
    environment:
      - CHOKIDAR_USEPOLLING=true
      - DATABASE_HOST=db
      - DATABASE_USER=user
      - DATABASE_PASSWORD=password
      - DATABASE_DB=kochbuch
      - PORT=5001
    depends_on:
      - db



  # Client
  
  client:
    build:
      context: ./client
      target: production
    restart: always
    ports:
      - "80:80"
    develop:
      watch:
        - path: ./client
          action: sync
          target: /app
        - path: ./client/package.json
          action: rebuild
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true



volumes:
  postgres_data:
  pgadmin_data: