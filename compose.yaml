services:

  # Database

  db:
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kochbuch
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"



  # Backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_HOST: db
      DATABASE_USER: user
      DATABASE_PASSWORD: password
      DATABASE_DB: kochbuch
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules



  # Client
  
  client:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./client:/app
      - /app/node_modules



  # pgAdmin

  pgadmin:
    image: elestio/pgadmin:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: login@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: password
      PGADMIN_LISTEN_PORT: 8080
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: True
    ports:
      - "8080:8080"



volumes:
  postgres_data: